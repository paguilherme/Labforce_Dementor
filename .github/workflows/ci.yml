name: Dementor CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PDF runtime and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          python -m pip install . pytest build twine
      - name: Test assessment, audit, reports and AI consent
        run: python -m pytest -q
      - name: Build and validate packages
        run: |
          python -m build
          python -m twine check --strict dist/*
          dementor --version
          labforce-dementor --version
      - uses: actions/upload-artifact@v4
        with:
          name: dementor-package-py${{ matrix.python }}
          path: dist/*
