name: Publish Labforce Dementor

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-test-publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and runtime dependencies
        run: |
          python -m pip install --upgrade pip build twine pytest
          python -m pip install .
      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())['project']['version']
          expected = f"v{version}"
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f"release tag must be {expected}")
          PY
      - name: Run tests
        run: python -m pytest -q
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Test wheel entry points
        run: |
          python -m venv /tmp/dementor-wheel-test
          /tmp/dementor-wheel-test/bin/python -m pip install --no-deps dist/*.whl
          /tmp/dementor-wheel-test/bin/dementor --version
          /tmp/dementor-wheel-test/bin/labforce-dementor --version
      - uses: actions/upload-artifact@v4
        with:
          name: labforce-dementor-${{ github.event.release.tag_name }}
          path: dist/*
          if-no-files-found: error
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
